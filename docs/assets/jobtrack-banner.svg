    <text x="122" y="88" fill="#F3FAF5" font-size="28" font-weight="700">JobTrack.</text>
    <text x="64" y="169" fill="#A6E3C0" font-size="13" font-weight="700" letter-spacing="3">YOUR PERSONAL JOB SEARCH WORKSPACE</text>
    <text x="60" y="236" fill="#F3FAF5" font-size="57" font-weight="700" letter-spacing="-2">Your next chapter,</text>
    <text x="60" y="302" fill="#A6E3C0" font-size="57" font-weight="700" letter-spacing="-2">organized.</text>
    <text x="64" y="352" fill="#B4C7BD" font-size="19">Applications, interviews, and progress. All in one place.</text>
    <rect x="64" y="390" width="174" height="34" rx="17" fill="#244A3A"/>
    <text x="151" y="412" fill="#D5EBDD" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">TRACK WITH CLARITY</text>
    <rect x="745" y="68" width="469" height="356" rx="22" fill="#081710" opacity=".35"/>
    <rect x="733" y="56" width="469" height="356" rx="22" fill="url(#card)" stroke="#3E6251"/>
    <text x="765" y="99" fill="#EEF8F1" font-size="18" font-weight="700">Every opportunity has a next step.</text>
    <text x="765" y="124" fill="#AAC3B5" font-size="13">Keep yours in view.</text>
    <path d="M792 177V348" stroke="#517664" stroke-width="2" stroke-dasharray="4 6"/>
    <rect x="767" y="150" width="400" height="68" rx="12" fill="#284E3E"/>
