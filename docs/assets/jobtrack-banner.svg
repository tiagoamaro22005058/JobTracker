<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">JobTrack — Your next chapter, organized.</title>
  <desc id="desc">A branded illustration of the stages Applied, Interview, and Offer. Product illustration, not a screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="480" gradientUnits="userSpaceOnUse"><stop stop-color="#122C25"/><stop offset="1" stop-color="#0B1B17"/></linearGradient>
    <linearGradient id="card" x1="765" y1="95" x2="1190" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#254D3F"/><stop offset="1" stop-color="#162F27"/></linearGradient>
  </defs>
  <rect width="1280" height="480" rx="24" fill="url(#bg)"/>
  <circle cx="1178" cy="64" r="240" stroke="#284B3D"/>
  <circle cx="1178" cy="64" r="185" stroke="#284B3D"/>
  <circle cx="1178" cy="64" r="130" stroke="#284B3D"/>
