    <path d="m787 184 4 4 8-8" stroke="#18364B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="820" y="179" fill="#F0F7F2" font-size="16" font-weight="700">Applied</text>
    <text x="820" y="200" fill="#B4CCBF" font-size="12">Your next opportunity starts here</text>
    <rect x="767" y="232" width="400" height="68" rx="12" fill="#284E3E"/>
    <circle cx="793" cy="266" r="13" fill="#D4B5F1"/>
    <path d="M788 261h10v8h-6l-4 3v-11Z" stroke="#44305C" stroke-width="1.8" stroke-linejoin="round"/>
